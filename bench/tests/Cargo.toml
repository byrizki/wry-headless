workspace = {}

[package]
name = "hello_world"
version = "0.1.0"
description = "A very simple WRY Appplication"
edition = "2018"

[dependencies]
wry = { path = "../../" }
serde = { version = "1.0", features = ["derive"] }
tao = "0.37"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = { version = "0.18" }

[[bin]]
name = "bench_hello_world"
path = "src/hello_world.rs"

[[bin]]
name = "bench_cpu_intensive"
path = "src/cpu_intensive.rs"

[[bin]]
name = "bench_custom_protocol"
path = "src/custom_protocol.rs"

[[bin]]
name = "bench_headless"
path = "src/headless.rs"

[[bin]]
name = "bench_print_to_pdf_memory"
path = "src/print_to_pdf_memory.rs"

[[bin]]
name = "bench_print_to_pdf_file"
path = "src/print_to_pdf_file.rs"



[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
